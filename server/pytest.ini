[pytest]
testpaths = tests
pythonpath = .
# fastapi.testclient가 starlette.testclient를 httpx로 불러 생기는 경고 하나만 숨긴다.
# 테스트 도구(TestClient) 쪽 사정이고 서버 코드와 무관해서다. 다른 경고는 그대로 보인다.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
