# 로컬 실행용. 처음 한 번 `cp .env.example .env` 후 `docker compose up --build`.
# (이 저장소의 Compose v2.19는 env_file의 `required: false`를 모르므로 .env 파일이 있어야 한다)
services:
  analogy-api:
    build: .
    ports:
      - "8000:8000"
    # GEMINI_API_KEY는 .env에서 읽는다(.env는 커밋하지 않는다). 키가 비어 있어도 서버는 뜬다.
    env_file:
      - .env
    environment:
      WORKSPACE: common_maplestory
      RATE_LIMIT_PER_MIN: "30"
      # 아래 볼륨으로 마운트한 공통 그래프 파일
      COMMON_GRAPH_PATH: /data/common/maplestory.json
      # 금칙어 목록(T-114). 같은 볼륨에 있다. 못 읽으면 /v1/analogy가 503
      BLOCKLIST_PATH: /data/common/blocklist.json
    volumes:
      - ../extension/data/common:/data/common:ro
