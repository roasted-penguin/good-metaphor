name: test

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: 빌드 산출물이 커밋과 같은지 확인
        run: git diff --exit-code -- extension/offscreen.js extension/vendor
      - run: npm run test:unit
      # 미리 계산 벡터(T-193, ADR 0015): 못 쓰는 파일(형식·embedderId·접두어)은 실패, 그래프와 어긋난 항목은 경고만
      # (런타임은 어긋난 텍스트만 임베딩한다). 그래프를 고친 PR은 `npm run build:vectors`(실제 크롬)로 다시 만들어 함께 커밋한다
      - run: npm run check:vectors
      # 대체 임베더 기준선(T-179): 순수 JS라 결정적이고 1초 안팎. 맞던 문장이 1위에서 틀리면 실패.
      # 받아들일 손실이면 `npm run eval:fallback -- --write-baseline`으로 기준선을 다시 써서 같은 PR에 커밋한다
      - run: npm run eval:fallback -- --baseline
      - run: npm run test:e2e

  # 서버(Python, FastAPI) 테스트. 위 `test` 잡 이름은 브랜치 보호 필수 체크라 바꾸지 않는다.
  # 테스트가 저장소 파일(extension/data/common/*.json, tests/fixtures/*)을 읽으므로 저장소 전체를 체크아웃한다.
  # 네트워크·API 키 없이 돈다(LLM·임베딩은 가짜 전송, tiktoken 대신 글자 토크나이저).
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt
      # requirements-dev.txt가 이미 `-r requirements.txt`를 포함하지만,
      # 명세대로 둘 다 적어 실행 의존성이 빠지지 않음을 한눈에 보이게 한다(중복 지정은 pip가 하나로 합친다).
      - run: pip install -r server/requirements.txt -r server/requirements-dev.txt
      - run: cd server && python -m pytest -q
