name: smoke

# 실제 키로 LLM 제공자 호출 확인(T-101). 무료 한도를 쓰므로 PR마다 돌리지 않고 Actions 탭에서 수동 실행한다.
# 키는 저장소 Actions 비밀값(GEMINI_API_KEY, GROQ_API_KEY, NVIDIA_API_KEY)에서만 온다. 키가 없는 제공자는 스크립트가 건너뛴다.
on:
  workflow_dispatch:
    inputs:
      all_models:
        description: '레지스트리의 모델 목록을 모두 시험 (무료 한도에 주의)'
        type: boolean
        default: false
      compare:
        description: '평가셋에서 N문장을 골라 제공자별 비교표(T-122). 0이면 안 함. 제공자별 분당 4회라 10문장에 약 3분'
        type: string
        default: '0'
      precise_judge:
        description: '정밀 모드 합친 호출(추상 구조 + 태그 판정 JSON, T-184)을 고정 8문장으로 확인(T-186). 실패로 세지 않고 제공자별 한 줄 요약'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: 제공자 스모크
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ALL_MODELS: ${{ inputs.all_models && '--all-models' || '' }}
          COMPARE: ${{ inputs.compare }}
          PRECISE_JUDGE: ${{ inputs.precise_judge && 'true' || '' }}
        run: npm run smoke:providers -- $ALL_MODELS
