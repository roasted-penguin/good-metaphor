# 맥 Ollama 시간창 설정(T-411). 시간창은 이 파일 한 곳에서만 고친다.
# 형식은 서버 EXTRACT_WINDOW와 같다: HH:MM-HH:MM, 쉼표로 여러 개, 끝이 시작보다 이르면 자정을 넘는다.
# 서버(EC2) .env의 EXTRACT_WINDOW에도 같은 값을 넣는다(docs/architecture-lightrag.md "운영 시간창").
# 고친 뒤에는 ./install.sh를 다시 돌려야 launchd에 반영된다.
OLLAMA_WINDOW="12:10-13:00,23:00-07:00"

# Homebrew로 설치한 ollama 경로(launchd는 PATH가 짧아 절대 경로를 쓴다)
OLLAMA_BIN="/opt/homebrew/bin/ollama"
