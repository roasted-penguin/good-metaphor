<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>프레임 테스트</title>
<style>body{font:18px/1.7 sans-serif;margin:8px;color:#222}</style></head><body>
<p id="fa">같은출처프레임테스트 변동금리 대출은 기준금리가 오르면 매달 내는 이자도 함께 늘어난다.</p>
<p id="fb">다른출처프레임테스트 API 서버는 분당 요청 수에 상한을 두어 한 사용자가 자원을 독점하지 못하게 한다.</p>
<p id="fc">로딩지연테스트 고정금리 대출은 약정 기간 동안 금리가 바뀌지 않는다.</p>
</body></html>
