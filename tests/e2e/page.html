<h1>변동금리와 고정금리, 무엇이 다를까</h1>
<p id="p1">변동금리 대출은 기준금리가 오르면 매달 내는 이자도 함께 늘어난다. 반면 고정금리는 약정 기간 동안 금리가 바뀌지 않는다.</p>
<p id="p2">API 서버는 분당 요청 수에 상한을 두어 한 사용자가 자원을 독점하지 못하게 한다. 이를 레이트 리밋이라고 부른다.</p>
<p id="p3">Leverage amplifies both gains and losses, so a small price drop can wipe out your entire margin.</p>
